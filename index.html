<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Spooky store</title>
</head>
<body>
     <nav class="spooky-navbar">
        <a href="#" class="logo">
            <span class="icon">
                <img src="./assets/logo.png" alt="manager of spooky store" width="40px">
            </span>
            spooky <span>store</span>
        </a>
        <div class="spooky-links">
            <a href="#home" class="home"> Home</a>
            <a href="#collection"> collection</a>
            <a href="#about">About</a>
        </div>
        <a href="#cart" class="cart">
            <span>cart</span>
            <span class="cart-item">0 </span>
        </a>
     </nav>
     <div class="theme" id="theme">
        <div class="title-img">
        <img src="./assets/witch.png" alt="spooky store manager" width="300px">
        </div>
        <h1 class="title">SPOOKY STORE</h1>
     </div>
     <br><br><br>
    <section  class="spooky-shop-section" id="collection">
        <div class="shop-heading">
            <p class="headone">THE BEST COLLECTION</p>
            <h1>Cursed <span>ITEM</span></h1>
            <p>object that should have staued buried</p>
        </div>
        <div class="shop-grid">
            <div class="item-card">
                <div class="item-image">
                    <img src="./assets/shop-items/skull.png" alt="an cursed skull for black magic">
                    <span class="item-tag">CURSED</span>
                </div>
                <div class="item-info">
                    <p class="item-type">black magic</p>
                    <h2>A skull</h2>
                    <p class="item-detail">
                        A cursed skull of a man killed by a ghost , it can be used for black magic.
                    </p>
                     <div class="item-down">
                    <span class="price">$30</span>
                    <button class="add-to-cart">ADD TO CART</button>
                </div>
                </div>
            </div>
        </div>
    </section>
     <script src="script.js"></script>
</body>
</html>
